name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dogbooker
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dogbooker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dogbooker -d dogbooker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create isolated test configuration
        run: |
          npm run setup
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          let env = readFileSync('.env.local', 'utf8');
          env = env.replace(/^DATABASE_URL=.*$/m, 'DATABASE_URL=postgresql://dogbooker:ci-only-password@127.0.0.1:5432/dogbooker_test');
          env = env.replace(/^DATABASE_URL_UNPOOLED=.*$/m, 'DATABASE_URL_UNPOOLED=postgresql://dogbooker:ci-only-password@127.0.0.1:5432/dogbooker_test');
          env = env.replace('ALLOW_TEST_DATABASE=false', 'ALLOW_TEST_DATABASE=true');
          writeFileSync('.env.local', env, { mode: 0o600 });
          JS
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run licenses && git diff --exit-code -- docs/dependencies.json
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
