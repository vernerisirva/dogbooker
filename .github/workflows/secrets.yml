name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts="--all --full-history" --redact=100 --no-banner .'
