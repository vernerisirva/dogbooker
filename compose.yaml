services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogbooker
      POSTGRES_DB: dogbooker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - dogbooker-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogbooker -d dogbooker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dogbooker-data:
